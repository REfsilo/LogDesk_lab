<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка сервера</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">
        <section class="card error-page">
            <h1 data-testid="error-title">Ошибка сервера</h1>

            <p data-testid="error-message">
                {{ error_message }}
            </p>

            <p>
                Код обращения:
                <strong data-testid="request-id">{{ request_id }}</strong>
            </p>

            <p>
                Сообщите этот код преподавателю или разработчику для поиска ошибки в логах.
            </p>

            <a href="{{ url_for('index') }}">Вернуться на главную</a>
        </section>
    </main>
</body>
</html>
